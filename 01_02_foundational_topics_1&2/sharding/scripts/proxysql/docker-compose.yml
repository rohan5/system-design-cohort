services:

  mysql-shard1:
    image: mysql:8.0
    container_name: mysql-shard1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    ports:
      - "3307:3306"
    volumes:
      - shard1_data:/var/lib/mysql
      - ./init/shard1.sql:/docker-entrypoint-initdb.d/init.sql

  mysql-shard2:
    image: mysql:8.0
    container_name: mysql-shard2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    ports:
      - "3308:3306"
    volumes:
      - shard2_data:/var/lib/mysql
      - ./init/shard2.sql:/docker-entrypoint-initdb.d/init.sql

  proxysql:
    image: proxysql/proxysql
    container_name: proxysql
    ports:
      - "6033:6033"   # MySQL client port
      - "6032:6032"   # Admin port
    depends_on:
      - mysql-shard1
      - mysql-shard2

volumes:
  shard1_data:
  shard2_data: